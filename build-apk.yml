
name: Build THERMOSTEP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare HTML assets
        run: |
          mkdir -p src/main/assets
          cp thermostep.html src/main/assets/thermostep.html

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          ls -lh build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THERMOSTEP-debug-apk
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
