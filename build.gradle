
plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.thermostep.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thermostep.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'

            java {
                srcDirs = ['.']
                include '**/*.kt'
                exclude '**/build/**'
                exclude '**/.gradle/**'
            }

            assets {
                srcDirs = ['src/main/assets']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
